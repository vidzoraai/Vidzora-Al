  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT_ID.firebasestorage.app",

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vidzora AI</title>
<style>
:root{--bg:#09090b;--p:#121216;--p2:#19191f;--t:#fff;--m:#9999a5;--b:#2b2b32;--a:#fff;--at:#000}
body.light{--bg:#f5f5f7;--p:#fff;--p2:#eeeef2;--t:#111;--m:#666674;--b:#d8d8df;--a:#111;--at:#fff}
*{box-sizing:border-box}
html{color-scheme:dark}
body.light{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit;border-radius:12px}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.top{height:70px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-size:24px;font-weight:900}
.logo span{font-weight:400}
.sp{flex:1}
.btn{border:1px solid var(--b);background:var(--p);color:var(--t);padding:12px 16px;font-weight:700}
.primary{border:0;background:var(--a);color:var(--at);padding:13px 18px;font-weight:800}
.round{width:44px;height:44px;border-radius:50%;padding:0}
.layout{display:flex;min-height:calc(100vh - 70px)}
aside{width:260px;border-right:1px solid var(--b);padding:15px;position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}
.nav{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--t);padding:13px;border-radius:12px;margin:2px 0}
.nav.active,.nav:hover{background:var(--p2);border-color:var(--b)}
.small{font-size:12px}
.muted{color:var(--m)}
.title{letter-spacing:2px;color:var(--m);font-size:11px;margin:20px 10px 7px}
.profile{border:1px solid var(--b);background:var(--p);padding:13px;border-radius:14px;margin-top:18px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--a);color:var(--at);font-weight:900}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.main{flex:1;padding:25px}
.page{max-width:1200px;margin:auto}
.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}
.head h1{margin:0;font-size:34px}
.card{background:var(--p);border:1px solid var(--b);border-radius:18px;padding:18px}
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.stat{font-size:28px;font-weight:900;margin-top:7px}
label{font-weight:750;display:block;margin:10px 0 6px}
input,select,textarea{width:100%;padding:13px;background:var(--bg);border:1px solid var(--b);color:var(--t)}
textarea{min-height:140px}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px;padding-bottom:4px}
.tab{white-space:nowrap}
.tab.on{background:var(--a);color:var(--at)}
.studio{display:grid;grid-template-columns:1.4fr .6fr;gap:15px}
.progress{height:10px;background:var(--p2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--a);width:0;transition:width .25s}
.refs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}
.ref{aspect-ratio:1;position:relative;overflow:hidden;border:1px solid var(--b);border-radius:9px}
.ref img{width:100%;height:100%;object-fit:cover}
.ref button{position:absolute;right:2px;top:2px;border:0;background:#000;color:#fff;border-radius:50%}
.gallery{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.thumb{aspect-ratio:16/9;background:#050505;display:grid;place-items:center;font-size:45px;border-radius:12px}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.authbox{width:min(540px,100%);background:var(--p);border:1px solid var(--b);border-radius:24px;padding:28px}
.authbox h1{font-size:42px;line-height:1;margin:20px 0 10px}
.divider{display:flex;align-items:center;gap:10px;color:var(--m);margin:16px 0}
.divider:before,.divider:after{content:"";height:1px;background:var(--b);flex:1}
.msg{padding:11px 13px;border:1px solid var(--b);border-radius:12px;background:var(--p2);margin:12px 0}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}
.modal>div{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:18px;padding:20px}
.hide{display:none!important}
.notice{border-left:3px solid var(--t);padding:10px 13px;background:var(--p2);border-radius:8px}
@media(max-width:900px){
 aside{position:fixed;left:0;transform:translateX(-105%);z-index:10;background:var(--bg);width:280px;transition:.2s}
 aside.open{transform:none}
 .studio{grid-template-columns:1fr}
 .g4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
 .main{padding:15px}
 .g4,.g3,.g2{grid-template-columns:1fr}
 .head{flex-direction:column}
 .head h1{font-size:29px}
 .authbox h1{font-size:35px}
 .hideMob{display:none}
 .refs{grid-template-columns:repeat(3,1fr)}
 .top{padding:0 12px}
}
</style>
</head>
<body>
<div id="app"></div>

<!-- Firebase Auth: no secret/private key belongs here. -->
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,
  sendPasswordResetEmail,signInWithPopup,signInWithRedirect,getRedirectResult,
  GoogleAuthProvider,signOut,updateProfile,updateEmail,updatePassword
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* ==========================================================
   1) PASTE YOUR FIREBASE WEB APP CONFIG HERE
   Firebase Console -> Project settings -> Your apps -> Web app
   ========================================================== */
const firebaseConfig = {
  apiKey: "PASTE_FIREBASE_API_KEY",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT_ID.firebasestorage.app",
  messagingSenderId: "PASTE_MESSAGING_SENDER_ID",
  appId: "PASTE_FIREBASE_APP_ID"
};

/* Optional UI owner email. IMPORTANT:
   This is NOT a secure admin permission. For production,
   use Firebase Admin SDK + custom claims on your backend. */
const OWNER_EMAIL = "YOUR_OWNER_GMAIL@gmail.com";

const firebaseConfigured =
  !firebaseConfig.apiKey.startsWith("PASTE_") &&
  !firebaseConfig.projectId.startsWith("PASTE_") &&
  !firebaseConfig.appId.startsWith("PASTE_");

let appFirebase=null,auth=null;

if(firebaseConfigured){
  appFirebase=initializeApp(firebaseConfig);
  auth=getAuth(appFirebase);
  auth.useDeviceLanguage();

  // If Google redirected back to this page, finish the login.
  getRedirectResult(auth).catch(showAuthError);

  onAuthStateChanged(auth,user=>{
    if(user){
      S.user=userToState(user);
      save();
      render();
    }else{
      S.user=null;
      render();
    }
  });
}else{
  console.warn("Vidzora: Firebase config has not been filled in.");
}

/* ===================== APP DATA ===================== */
const plans={
 free:{pk:0,usd:0,q:{v8:3,v15:1,v20:0,v30:0,v60:0,v300:0,v900:0,v1800:0,img:10,voice:3,music:3}},
 weekly:{pk:450,usd:1.6,q:{v8:100,v15:30,v20:0,v30:0,v60:0,v300:0,v900:0,v1800:0,img:200,voice:20,music:20}},
 monthly:{pk:2500,usd:8.9,q:{v8:200,v15:80,v20:30,v30:50,v60:10,v300:2,v900:0,v1800:0,img:500,voice:50,music:50}},
 yearly:{pk:14000,usd:49.9,q:{v8:1000,v15:500,v20:0,v30:1000,v60:200,v300:30,v900:50,v1800:10,img:2020,voice:-1,music:-1}}
};
const durations=[
 ["8 seconds","v8"],["15 seconds","v15"],["20 seconds","v20"],["30 seconds","v30"],
 ["1 minute","v60"],["5 minutes","v300"],["15 minutes","v900"],["30 minutes","v1800"]
];
const ratios=["9:16","16:9","1:1","4:5","4:3","3:2"];
const modes=[
 ["Text to AI Video","video"],["Image + Prompt Video","imgprompt"],["Image to Video","imgvideo"],
 ["Music Generator","music"],["Voiceover Generator","voice"],["Image Generator","image"],
 ["Thumbnail Generator","thumb"],["AI Story","story"]
];

let S={
 user:null,page:"overview",theme:localStorage.vzTheme||"dark",mode:"video",
 refs:[],media:JSON.parse(localStorage.vzMedia||"[]"),prog:0,authMode:"login",busy:false
};

document.body.className=S.theme==="light"?"light":"";

const save=()=>{
  localStorage.vzTheme=S.theme;
  localStorage.vzMedia=JSON.stringify(S.media);
};

const userKey=()=>S.user?.uid||"guest";
const owner=()=>!!S.user && (S.user.email||"").toLowerCase()===(OWNER_EMAIL||"").toLowerCase();
const plan=()=>owner()?{pk:0,usd:0,q:Object.fromEntries(Object.keys(plans.free.q).map(k=>[k,-1]))}:plans[S.user?.plan||"free"];
const used=k=>+(localStorage["vzU_"+userKey()+"_"+k]||0);
const inc=k=>localStorage["vzU_"+userKey()+"_"+k]=used(k)+1;
const q=x=>x<0?"∞":x;
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function userToState(user){
  return {
    uid:user.uid,email:user.email||"",name:user.displayName||((user.email||"User").split("@")[0]),
    photoURL:user.photoURL||"",provider:user.providerData?.[0]?.providerId||"password",
    plan:"free"
  };
}

function showAuthError(error){
  console.error(error);
  const code=error?.code||"";
  const map={
    "auth/invalid-credential":"Email or password is incorrect.",
    "auth/invalid-login-credentials":"Email or password is incorrect.",
    "auth/user-not-found":"No account was found for this email.",
    "auth/wrong-password":"Email or password is incorrect.",
    "auth/email-already-in-use":"This email already has an account. Log in instead.",
    "auth/weak-password":"Password is too weak.",
    "auth/invalid-email":"Please enter a valid email address.",
    "auth/popup-closed-by-user":"Google sign-in was cancelled.",
    "auth/popup-blocked":"Your browser blocked the Google popup. Try again.",
    "auth/unauthorized-domain":"This website domain is not authorized in Firebase.",
    "auth/operation-not-allowed":"Enable this sign-in method in Firebase Authentication."
  };
  alert(map[code]||error?.message||"Authentication failed.");
}

function theme(){
  S.theme=S.theme==="dark"?"light":"dark";
  document.body.className=S.theme==="light"?"light":"";
  save();render();
}

async function logout(){
  if(!auth)return;
  try{await signOut(auth)}catch(e){showAuthError(e)}
}

function go(p){
  S.page=p;
  document.querySelector("aside")?.classList.remove("open");
  render();
}

/* ===================== AUTH ===================== */
function auth(){
  document.body.className=S.theme==="light"?"light":"";
  const signup=S.authMode==="signup";
  const configured=firebaseConfigured;

  document.getElementById("app").innerHTML=`
  <div class="auth">
    <div class="authbox">
      <div class="row">
        <b class="logo">◢ Vidzora <span>AI</span></b>
        <div class="sp"></div>
        <button class="btn round" onclick="theme()" title="Dark / Light mode">${S.theme==="dark"?"☀":"☾"}</button>
      </div>

      <h1>${signup?"Welcome to Vidzora":"Welcome back."}</h1>
      <p class="muted">Create, render and manage your AI video projects.</p>

      ${!configured?`
        <div class="msg">
          <b>Firebase setup required</b>
          <div class="small muted" style="margin-top:5px">
            Paste your Firebase Web App config into <code>firebaseConfig</code> in this file,
            then enable Google and Email/Password in Firebase Authentication.
          </div>
        </div>`:""}

      <form onsubmit="emailAuth(event)">
        ${signup?`<label>Name</label><input id="name" required maxlength="80" placeholder="Your name">`:""}
        <label>Email address</label>
        <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">

        <label>Password</label>
        <input id="pass" type="password" required minlength="6"
               autocomplete="${signup?"new-password":"current-password"}" placeholder="••••••••">

        ${!signup?`
          <div style="display:flex;justify-content:flex-end;margin-top:8px">
            <button type="button" class="btn" onclick="resetPass()">Forgot password?</button>
          </div>`:""}

        <button class="primary" style="width:100%;margin-top:18px" ${!configured||S.busy?"disabled":""}>
          ${S.busy?"Please wait…":signup?"Create account":"Log in"}
        </button>
      </form>

      <div class="divider">or continue with</div>

      <button class="btn" style="width:100%" onclick="googleLogin()" ${!configured||S.busy?"disabled":""}>
        ◉ Continue with Google
      </button>

      <p style="text-align:center;margin-top:18px">
        ${signup?"Already have an account?":"New to Vidzora?"}
        <button class="btn" onclick="S.authMode=S.authMode==='login'?'signup':'login';render()">
          ${signup?"Log in":"Create an account"}
        </button>
      </p>

      <div class="notice small muted">
        ${signup?
          "Your account is created in Firebase and you are signed in automatically.":
          "Google sign-in opens the real Google account chooser. Email login uses Firebase Authentication."}
      </div>
    </div>
  </div>`;
}

async function emailAuth(e){
  e.preventDefault();
  if(!auth)return alert("First configure Firebase in the code.");
  S.busy=true;render();

  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("pass").value;

  try{
    if(S.authMode==="signup"){
      const name=document.getElementById("name").value.trim();
      const cred=await createUserWithEmailAndPassword(auth,email,password);
      if(name) await updateProfile(cred.user,{displayName:name});
    }else{
      await signInWithEmailAndPassword(auth,email,password);
    }
  }catch(err){
    showAuthError(err);
    S.busy=false;render();
  }
}

async function googleLogin(){
  if(!auth)return alert("First configure Firebase in the code.");
  S.busy=true;render();

  try{
    const provider=new GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});

    // Redirect is preferred on phones; popup is convenient on desktop.
    const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(mobile){
      await signInWithRedirect(auth,provider);
    }else{
      await signInWithPopup(auth,provider);
    }
  }catch(err){
    S.busy=false;
    showAuthError(err);
    render();
  }
}

async function resetPass(){
  if(!auth)return alert("First configure Firebase in the code.");
  const email=document.getElementById("email")?.value.trim().toLowerCase();
  if(!email)return alert("Enter your email address first.");

  try{
    await sendPasswordResetEmail(auth,email);
    alert("Password reset email sent. Check your Gmail inbox/spam folder.");
  }catch(err){showAuthError(err)}
}

/* ===================== MAIN APP ===================== */
function nav(id,label){
  return `<button class="nav ${S.page===id?"active":""}" onclick="go('${id}')">${label}</button>`;
}

function app(){
  document.getElementById("app").innerHTML=`
  <header class="top">
    <button class="btn round" onclick="document.querySelector('aside').classList.toggle('open')">☰</button>
    <b class="logo">◢ Vidzora <span>AI</span></b>
    <div class="sp"></div>
    <button class="btn round" onclick="theme()">${S.theme==="dark"?"☀":"☾"}</button>
    <button class="primary hideMob" onclick="go('studio')">Open Studio</button>
  </header>

  <div class="layout">
    <aside>
      <div class="card">
        <small class="muted">${owner()?"OWNER MODE":"PLAN"}</small>
        <h3>${owner()?"Unlimited":S.user.plan}</h3>
        <div class="progress"><i style="width:${owner()?100:70}%"></i></div>
      </div>

      <div class="title">WORKSPACE</div>
      ${nav("overview","◆ Overview")}
      ${nav("studio","✎ Studio")}
      ${nav("gallery","▤ My Gallery")}

      <div class="title">ACCOUNT</div>
      ${nav("subscription","Rs Subscription")}
      ${nav("renew","＋ Renew / Upgrade")}
      ${nav("support","? Support")}
      ${nav("settings","⚙ Settings")}
      ${owner()?nav("owner","♛ Owner Console"):""}

      <div class="profile">
        <div class="row">
          <div class="avatar">${esc((S.user.name||"V")[0].toUpperCase())}</div>
          <div>
            <b>${esc(S.user.name||"User")}</b>
            <div class="small muted">${esc(S.user.email)}</div>
          </div>
        </div>
        <button class="btn" style="width:100%;margin-top:10px" onclick="logout()">⇥ Sign out</button>
      </div>
    </aside>

    <main class="main"><div class="page">${page()}</div></main>
  </div>`;
}

function page(){
  if(S.page==="studio")return studio();
  if(S.page==="gallery")return gallery();
  if(S.page==="subscription"||S.page==="renew")return subscription();
  if(S.page==="support")return support();
  if(S.page==="settings")return settings();
  if(S.page==="owner")return ownerPage();
  return overview();
}

function overview(){
  const p=plan();
  return `
  <div class="head">
    <div><h1>Welcome, ${esc(S.user.name||"Creator")}.</h1><p class="muted">Your Vidzora AI workspace.</p></div>
    <button class="primary" onclick="go('studio')">＋ Create project</button>
  </div>
  <div class="grid g4">
    ${stat("Plan",owner()?"Owner Unlimited":S.user.plan)}
    ${stat("8s videos",owner()?"∞":used("v8")+" / "+q(p.q.v8))}
    ${stat("15s videos",owner()?"∞":used("v15")+" / "+q(p.q.v15))}
    ${stat("AI images",owner()?"∞":used("img")+" / "+q(p.q.img))}
  </div>
  <div class="grid g2" style="margin-top:15px">
    <div class="card"><h2>Start creating</h2><p class="muted">Video, image, voiceover, music and thumbnail tools.</p><button class="primary" onclick="go('studio')">Open Studio</button></div>
    <div class="card"><h2>Gallery</h2><p>${S.media.length} project(s)</p><button class="btn" onclick="go('gallery')">View Gallery</button></div>
  </div>`;
}
function stat(a,b){return `<div class="card"><small class="muted">${a}</small><div class="stat">${b}</div></div>`}

/* ===================== STUDIO ===================== */
function studio(){
  return `
  <div class="head"><div><h1>Studio</h1><p class="muted">Create and render projects.</p></div></div>

  <div class="tabs">
    ${modes.map(m=>`<button class="btn tab ${S.mode===m[1]?"on":""}" onclick="S.mode='${m[1]}';render()">${m[0]}</button>`).join("")}
  </div>

  <div class="studio">
    <div class="card">
      <form onsubmit="generate(event)">
        <label>Prompt</label>
        <textarea id="prompt" placeholder="Describe your video or asset..."></textarea>

        ${["video","imgprompt","imgvideo","story"].includes(S.mode)?`
          <div class="grid g2">
            <div><label>Duration</label><select id="dur">${durations.map(x=>`<option value="${x[1]}">${x[0]}</option>`).join("")}</select></div>
            <div><label>Aspect ratio</label><select id="ratio">${ratios.map(x=>`<option>${x}</option>`).join("")}</select></div>
          </div>
          <div class="grid g2">
            <div><label>Quality</label><select id="quality"><option>720p</option><option>1080p</option><option>4K</option></select></div>
            <div><label>Voiceover</label><select id="voice"><option>None</option><option>Character voice</option><option>Upload my voice</option></select></div>
          </div>
          <label>Reference images — maximum 10</label>
          <input type="file" accept="image/*" multiple onchange="refs(this.files)">
          <div class="refs">
            ${S.refs.map((r,i)=>`<div class="ref"><img src="${r}"><button type="button" onclick="S.refs.splice(${i},1);render()">×</button></div>`).join("")}
          </div>
          <button type="button" class="btn" style="margin-top:8px" onclick="S.refs=[];render()">Replace all references</button>
        `:`<label>Reference image / file</label><input type="file" accept="image/*,audio/*">`}

        <button class="primary" style="width:100%;margin-top:18px" ${S.busy?"disabled":""}>
          ${S.busy?"Rendering…":"Start generation"}
        </button>

        <p class
